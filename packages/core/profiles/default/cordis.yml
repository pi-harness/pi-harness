- id: agent
  name: cordis:group
  group: true
  config:
    - id: models
      name: "@pi-harness/core/plugins/models"
      config:
        provider: deepseek
        model: deepseek-v4-flash
        refreshOnCreate: false
    - id: resources
      name: "@pi-harness/core/plugins/resources"
      config: {}
    - id: model
      name: "@pi-harness/core/plugins/model"
      config: {}
    - id: session
      name: "@pi-harness/core/plugins/session"
      config:
        storage: jsonl
    - id: tools
      name: "@pi-harness/core/plugins/tools"
      config:
        names:
          - read
          - bash
          - edit
          - write
    - id: agent-teams
      name: "@pi-harness/core/plugins/agent-teams"
      config: {}
    - id: modlens
      name: "@pi-harness/core/plugins/modlens"
      config: {}
    - id: vision-toolkit
      name: "@pi-harness/core/plugins/vision-toolkit"
      config: {}
    - id: git-time-capsule
      name: "@pi-harness/core/plugins/git-time-capsule"
      config: {}
    - id: dependency-checker
      name: "@pi-harness/core/plugins/dependency-checker"
      config: {}
    - id: at-file
      name: "@pi-harness/core/plugins/at-file"
      config: {}
    - id: test-harness
      name: "@pi-harness/core/plugins/test-harness"
      config: {}
    - id: session-insights
      name: "@pi-harness/core/plugins/session-insights"
      config: {}
    - id: readme-gen
      name: "@pi-harness/core/plugins/readme-gen"
      config: {}
    - id: i18n-pair
      name: "@pi-harness/core/plugins/i18n-pair"
      config: {}
    - id: cleaner
      name: "@pi-harness/core/plugins/cleaner"
      config: {}
    - id: sql-lens
      name: "@pi-harness/core/plugins/sql-lens"
      config: {}
    - id: docker-sandbox
      name: "@pi-harness/core/plugins/docker-sandbox"
      config: {}
    - id: mcp-client
      name: "@pi-harness/core/plugins/mcp-client"
      config: {}
    - id: browser-fetch
      name: "@pi-harness/core/plugins/browser-fetch"
      config: {}
    - id: browser-session
      name: "@pi-harness/core/plugins/browser-session"
      config: {}
    - id: plugin-stars
      name: "@pi-harness/core/plugins/plugin-stars"
      config: {}
    - id: yaml-validator
      name: "@pi-harness/core/plugins/yaml-validator"
      config: {}
    - id: plugin-dev
      name: "@pi-harness/core/plugins/plugin-dev"
      config: {}
    - id: openpets
      name: "@pi-harness/core/plugins/openpets"
      config: {}
    - id: session-bridge
      name: "@pi-harness/core/plugins/session-bridge"
      config: {}
    - id: runtime
      name: "@pi-harness/core/plugins/runtime"
      config:
        thinkingLevel: medium
    - id: context
      name: "@pi-harness/core/plugins/context"
      config: {}
    - id: token-guard
      name: "@pi-harness/core/plugins/token-guard"
      config:
        maxPercent: 90
    - id: fail-logger
      name: "@pi-harness/core/plugins/fail-logger"
      config: {}
    - id: stdio
      name: "@pi-harness/core/plugins/stdio"
      config: {}
