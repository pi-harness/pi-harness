    - id: webserver
      name: "@pi-harness/host-webserver"
      config:
        host: !!js process.env.PI_HARNESS_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.PI_HARNESS_PORT ?? 3141)
        allowedHosts: !!js (process.env.PI_HARNESS_ALLOWED_HOSTS ?? '').split(',').filter((entry) => entry !== '')
- id: api
  name: "@pi-harness/api-gateway"
  config: {}
- id: web-app
  name: "@pi-harness/web-app"
  config:
    staticDir: !!js process.env.PI_HARNESS_WEB_DIST
