- id: agent
  name: cordis:group
  group: true
  config:
    - id: models
      name: "@pi-harness/core/plugins/models"
      config:
        provider: !!js process.env.PI_HARNESS_PROVIDER ?? 'everyapi'
        model: !!js process.env.PI_HARNESS_MODEL ?? 'deepseek-v4-flash'
        refreshOnCreate: false
    - id: resources
      name: "@pi-harness/core/plugins/resources"
      config: {}
    - id: model
      name: "@pi-harness/core/plugins/model"
      config: {}
    - id: session
      name: "@pi-harness/core/plugins/session"
      config:
        storage: jsonl
    - id: tools
      name: "@pi-harness/core/plugins/tools"
      config:
        names:
          - read
          - bash
          - edit
          - write
    - id: agent-teams
      name: "@pi-harness/core/plugins/agent-teams"
      config: {}
    - id: modlens
      name: "@pi-harness/core/plugins/modlens"
      config: {}
    - id: git-time-capsule
      name: "@pi-harness/core/plugins/git-time-capsule"
      config: {}
    - id: dependency-checker
      name: "@pi-harness/core/plugins/dependency-checker"
      config: {}
    - id: at-file
      name: "@pi-harness/core/plugins/at-file"
      config: {}
    - id: runtime
      name: "@pi-harness/core/plugins/runtime"
      config:
        thinkingLevel: medium
    - id: context
      name: "@pi-harness/core/plugins/context"
      config: {}
    - id: token-guard
      name: "@pi-harness/core/plugins/token-guard"
      config:
        maxPercent: 90
    - id: fail-logger
      name: "@pi-harness/core/plugins/fail-logger"
      config: {}
    - id: webserver
      name: "@pi-harness/host-webserver"
      config:
        host: !!js process.env.PI_HARNESS_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.PI_HARNESS_PORT ?? 3080)
- id: api
  name: "@pi-harness/api-gateway"
  config: {}
- id: web-app
  name: "@pi-harness/web-app"
  config:
    staticDir: !!js process.env.PI_HARNESS_WEB_DIST
