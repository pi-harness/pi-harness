- id: agent
  name: cordis:group
  group: true
  config:
    - id: models
      name: "@pi-harness/core/plugins/models"
      config:
        provider: !!js process.env.PI_HARNESS_PROVIDER ?? 'everyapi'
        model: !!js process.env.PI_HARNESS_MODEL ?? 'deepseek-v4-flash'
        refreshOnCreate: false
    - id: resources
      name: "@pi-harness/core/plugins/resources"
      config: {}
    - id: model
      name: "@pi-harness/core/plugins/model"
      config: {}
    - id: session
      name: "@pi-harness/core/plugins/session"
      config:
        storage: jsonl
    - id: tools
      name: "@pi-harness/core/plugins/tools"
      config:
        names:
          - read
          - bash
          - edit
          - write
    - id: runtime
      name: "@pi-harness/core/plugins/runtime"
      config:
        thinkingLevel: medium
    - id: webserver
      name: "@pi-harness/host-webserver"
      config:
        host: !!js process.env.PI_HARNESS_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.PI_HARNESS_PORT ?? 3080)
- id: api
  name: "@pi-harness/api-gateway"
  config: {}
- id: web-app
  name: "@pi-harness/web-app"
  config:
    staticDir: !!js process.env.PI_HARNESS_WEB_DIST
