name: Repair tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag whose root launcher or GitHub Release is missing
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Validate and checkout tagged release
        env:
          TARGET_TAG: ${{ inputs.tag }}
          MATERIALIZER: ${{ runner.temp }}/materialize-hardlinks.mjs
        run: |
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          git fetch origin main
          target=$(git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}")
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "$TARGET_TAG does not identify a commit in main history" >&2
            exit 1
          fi
          cp scripts/materialize-hardlinks.mjs "$MATERIALIZER"
          git checkout --detach "$target"
          expected_version="${TARGET_TAG#v}"
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_name" != "@pi-harness/pi-harness" ] || [ "$package_version" != "$expected_version" ]; then
            echo "$TARGET_TAG does not match the root launcher manifest" >&2
            exit 1
          fi

      - name: Rebuild registry-backed lockfile
        run: npm install --package-lock-only --prefer-online --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Publish missing launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
          MATERIALIZER: ${{ runner.temp }}/materialize-hardlinks.mjs
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN GitHub Actions secret is required for npm publishing" >&2
            exit 1
          fi
          package_name=$(node -p "require('./package.json').name")
          package_version="${TARGET_TAG#v}"
          if npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package_name@$package_version already exists; skipping"
          else
            node "$MATERIALIZER" node_modules
            if npm publish "." --access public --provenance; then
              echo "$package_name@$package_version published"
            elif npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; continuing"
            else
              echo "Publishing $package_name@$package_version failed" >&2
              exit 1
            fi
          fi

      - name: Create missing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TARGET_TAG already exists; skipping"
          else
            gh release create "$TARGET_TAG" --verify-tag --title "$TARGET_TAG" --generate-notes
          fi

      - name: Verify launcher availability
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          package_version="${TARGET_TAG#v}"
          budget_seconds=1800
          poll_seconds=10
          deadline=$(( $(date +%s) + budget_seconds ))
          until published_version=$(npm view "@pi-harness/pi-harness@$package_version" version --prefer-online --registry=https://registry.npmjs.org 2>/dev/null) && [ "$published_version" = "$package_version" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "@pi-harness/pi-harness@$package_version was not available from npm within $(( budget_seconds / 60 )) minutes" >&2
              exit 1
            fi
            echo "Waiting for @pi-harness/pi-harness@$package_version to become publicly available"
            sleep "$poll_seconds"
          done
          npm pack "@pi-harness/pi-harness@$package_version" --ignore-scripts --silent --pack-destination "$RUNNER_TEMP" --registry=https://registry.npmjs.org
