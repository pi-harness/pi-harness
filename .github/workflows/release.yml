name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm test
          npm run lint
          git diff --check

      - name: Prepare release version
        id: metadata
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          existing_tag=""
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            target=$(git rev-list -n 1 "$tag")
            parent=$(git rev-parse "$target^" 2>/dev/null || true)
            if [ "$target" = "$HEAD_SHA" ] || [ "$parent" = "$HEAD_SHA" ]; then
              existing_tag="$tag"
              break
            fi
          done

          if [ -n "$existing_tag" ]; then
            version="${existing_tag#v}"
          else
            package_name=$(node -p "require('./package.json').name")
            published_version=$(npm view "$package_name" version --registry=https://registry.npmjs.org 2>/dev/null || echo "0.0.0")
            tagged_version=$(git tag --list 'v*' --sort=-v:refname | head -n 1 | sed 's/^v//' || true)
            version=$(node -e '
              const versions = process.argv.slice(1).filter((value) => /^\d+\.\d+\.\d+$/.test(value));
              const latest = versions.map((value) => value.split(".").map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]).at(-1) ?? [0, 0, 0];
              process.stdout.write([latest[0], latest[1], latest[2] + 1].join("."));
            ' "$published_version" "$tagged_version")
          fi

          node scripts/set-release-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Reserve release tag
        id: release
        env:
          HEAD_SHA: ${{ github.sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          tag_exists=false
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_exists=true
            target=$(git rev-list -n 1 "$TAG")
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json packages/*/package.json apps/*/package.json examples/*/package.json packages/api-gateway/src/marketplace-entries
            git commit -m "release: $TAG"
            target=$(git rev-parse HEAD)
            git tag "$TAG" "$target"
          fi
          parent=$(git rev-parse "$target^" 2>/dev/null || true)
          if [ "$target" != "$HEAD_SHA" ] && [ "$parent" != "$HEAD_SHA" ]; then
            echo "$TAG does not belong to $HEAD_SHA" >&2
            exit 1
          fi
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_main" = "$HEAD_SHA" ]; then
            if [ "$tag_exists" = true ]; then
              git push origin "$target:refs/heads/main"
            else
              git push --atomic origin "$target:refs/heads/main" "refs/tags/$TAG"
            fi
          elif [ "$remote_main" = "$target" ]; then
            if [ "$tag_exists" = false ]; then git push origin "refs/tags/$TAG"; fi
          else
            echo "main advanced to $remote_main; keeping $TAG without moving main"
            if [ "$tag_exists" = false ]; then git push origin "refs/tags/$TAG"; fi
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN GitHub Actions secret is required for npm publishing" >&2
            exit 1
          fi
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package_name@$package_version already exists; skipping"
          elif npm publish --access public; then
            echo "$package_name@$package_version published"
          elif npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; continuing"
          else
            echo "Publishing $package_name@$package_version failed" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.metadata.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; skipping"
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
